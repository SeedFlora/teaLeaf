# AndroidX is mandatory: every dependency here (Compose, CameraX, ExifInterface, the test
# libraries) is an androidx artifact, and without this flag AGP fails at the AAR metadata
# check rather than at compile time, which makes the error look unrelated.
android.useAndroidX=true

# Kotlin code style used by the Gradle Kotlin DSL tooling.
kotlin.code.style=official

# Only the ABI actually built is packaged; see abiFilters in app/build.gradle.kts.
android.nonTransitiveRClass=true

# The build host has 32 GB; 4 GB keeps Kotlin and AGP comfortable without starving the
# concurrently running GPU training job.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
